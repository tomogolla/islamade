<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>islamade · handmade crochet, made with love</title>
  <meta name="description" content="islamade is a small handmade crochet studio. Shop crochet bags, charms, sea friends, sweets, bows and blooms, or request a custom piece.">

  <!-- Open Graph: how the page looks when shared on social media.
       TODO: once the site is live, change these to full URLs, e.g. https://islamade.netlify.app/assets/og-image.png -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="islamade">
  <meta property="og:title" content="islamade · handmade crochet, made with love">
  <meta property="og:description" content="Cozy, colorful crochet pieces, each one made entirely by hand. Shop the collections or request a custom piece.">
  <meta property="og:image" content="assets/og-image.png">
  <meta property="og:url" content="index.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#FFFBF4">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chonburi&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Yellowtail&display=swap">
  <link rel="stylesheet" href="css/styles.css">

  <script src="js/config.js" defer></script>
  <script src="js/shapes.js" defer></script>
  <script src="js/layout.js" defer></script>
  <script src="js/catalog.js" defer></script>
  <script src="js/home.js" defer></script>
</head>

<body data-root="./" data-page="home">
  <a class="skip-link" href="#main">skip to content</a>
  <div id="site-header"></div>

  <main id="main" class="container">
    <!-- The bento grid. Tile colors: no two touching tiles share a color.
         Each tile is one big link; the "+" circle is part of that link. -->
    <div class="bento">

      <div class="bento__logo">
        <h1 class="logo">islamade</h1>
        <p>handmade crochet, made with love</p>
      </div>

      <!-- Tall tile on the left -->
      <!-- js/home.js updates this fallback link to the collection whose photo is shown. -->
      <a class="tile tile--collections playful accent-mint" href="pages/collections.html">
        <span class="plus" aria-hidden="true"><svg aria-hidden="true"><use href="#shape-plus"></use></svg></span>
        <div class="tile__photo">
          <!-- js/home.js swaps this placeholder for the featured collection's cover photo.
               alt is empty on purpose: the tile's title already says where the link goes. -->
          <img class="blob-mask" id="home-collections-photo" src="assets/images/placeholders/studio.svg" alt="" width="600" height="600">
          <svg class="shape tile__dashes" aria-hidden="true"><use href="#shape-dashes"></use></svg>
        </div>
        <h2 class="tile__title">collections</h2>
      </a>

      <!-- Top row -->
      <a class="tile tile--custom playful accent-pink" href="pages/custom.html">
        <span class="plus" aria-hidden="true"><svg aria-hidden="true"><use href="#shape-plus"></use></svg></span>
        <svg class="shape" aria-hidden="true"><use href="#shape-fan"></use></svg>
        <h2 class="tile__title">custom crochet</h2>
      </a>

      <a class="tile tile--shop playful accent-lavender" href="pages/shop.html">
        <span class="plus" aria-hidden="true"><svg aria-hidden="true"><use href="#shape-plus"></use></svg></span>
        <svg class="shape" aria-hidden="true"><use href="#shape-sprig"></use></svg>
        <h2 class="tile__title">shop crochet</h2>
      </a>

      <a class="tile tile--studio playful accent-butter" href="pages/about.html">
        <span class="plus" aria-hidden="true"><svg aria-hidden="true"><use href="#shape-plus"></use></svg></span>
        <svg class="shape" aria-hidden="true"><use href="#shape-circle"></use></svg>
        <h2 class="tile__title">behind the studio</h2>
      </a>

      <!-- Bottom row: external links. URLs come from js/config.js (data-link). -->
      <a class="tile tile--instagram playful accent-periwinkle" data-link="instagram" href="#" target="_blank" rel="noopener noreferrer">
        <span class="plus" aria-hidden="true"><svg aria-hidden="true"><use href="#shape-plus"></use></svg></span>
        <svg class="shape" aria-hidden="true"><use href="#shape-palm"></use></svg>
        <h2 class="tile__title">instagram<span class="sr-only"> (opens in a new tab)</span></h2>
      </a>

      <a class="tile tile--youtube playful accent-pink" data-link="youtube" href="#" target="_blank" rel="noopener noreferrer">
        <span class="plus" aria-hidden="true"><svg aria-hidden="true"><use href="#shape-plus"></use></svg></span>
        <svg class="shape" aria-hidden="true"><use href="#shape-starburst"></use></svg>
        <h2 class="tile__title">youtube<span class="sr-only"> (opens in a new tab)</span></h2>
      </a>

      <a class="tile tile--whatsapp playful accent-mint" data-link="whatsapp" href="#" target="_blank" rel="noopener noreferrer">
        <span class="plus" aria-hidden="true"><svg aria-hidden="true"><use href="#shape-plus"></use></svg></span>
        <svg class="shape" aria-hidden="true"><use href="#shape-arch"></use></svg>
        <h2 class="tile__title">whatsapp<span class="sr-only"> (opens in a new tab)</span></h2>
      </a>

    </div>
  </main>

  <div id="site-footer"></div>
</body>
</html>
